<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a1322" />
    <meta name="club-owner-app" content="0.24.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Empire FC" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="description"
      content="صاحب النادي — لعبة إدارة وملكية نادي كرة قدم"
    />
    <meta name="author" content="Ahmed S. Abodooh" />
    <meta name="copyright" content="© 2026 Ahmed S. Abodooh. All rights reserved." />
    <title>Empire FC — ابنِ إمبراطوريتك</title>
    <link rel="icon" type="image/svg+xml" href="/crest.svg" />
    <script>
      // تطبيق الثيم وحجم الخط قبل أول طلاء كي لا يومض الواجهة.
      try {
        var pref = localStorage.getItem("clubowner.theme") || "dark";
        var theme =
          pref === "system"
            ? matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
            : pref;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.fontsize =
          localStorage.getItem("clubowner.fontsize") === "large"
            ? "large"
            : "normal";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f2f6fb" : "#0a1322");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="modal-root"></div>
    <div id="palette-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
